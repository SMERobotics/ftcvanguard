name: Build iOS IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check app
        run: bun run --bun check

      - name: Build and sync web assets
        run: bun run ios:sync

      - name: Archive unsigned iOS app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Vanguard.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Vanguard.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Vanguard-unsigned.ipa Payload
          unzip -tq Vanguard-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Vanguard-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/ipa/Vanguard-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
